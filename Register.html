<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Mera Ilaka</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../Style.css/style.css">

    <link rel="stylesheet" href="../Style.css/auth.css">

    <link rel="stylesheet" href="../Style.css/forms.css">

            <link rel="stylesheet" href="../Style.css/responsive.css">

            <link rel="stylesheet" href="../Style.css/animations.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

        <link rel="stylesheet" href="../Style.css/auth.css">
</head>

<body>

    <section class="register-section">

        <div class="register-container">

            <div class="register-header">
                <i class="fa-solid fa-city"></i>
                <h1>Create Account</h1>
                <p>Join the Mera Ilaka Community</p>
            </div>

            <form id="registerForm">

                <div class="input-box">
                    <label>Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="input-box">
                    <label>Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="input-box">
                    <label>Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        required>
                </div>

                <div class="input-box">
                    <label>Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required>
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>
                </div>

                <div class="terms">

                    <label>
                        <input type="checkbox" required>
                        I agree to the Terms & Conditions
                    </label>

                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>

            <div class="Login-link">

                Already have an account?

                <a href="Login.html">
                    Login Here
                </a>

            </div>

            <form id="registerForm">

    <input
        type="text"
        id="fullname"
        placeholder="Full Name"
        required>

    <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

    <input
        type="tel"
        id="mobile"
        placeholder="Mobile Number"
        required>

    <input
        type="password"
        id="password"
        placeholder="Password"
        required>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required>

    <button type="submit">
        Register
    </button>

</form>

            <div class="home-link">

                <a href="Index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </section>

    <!-- JavaScript -->

    <script src="../Script.js/register.js"></script>

        <script src="../Script.js/script.js"></script>

</body>

</html>
